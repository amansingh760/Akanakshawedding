<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शुभ विवाह · Wedding Card Sender</title>
<meta name="description" content="Personalised wedding invitation PDF for each guest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap">
<style>
:root{--bg:#fff8ee;--card:#ffffff;--text:#3b1d0e;--muted:#7a5a46;--accent:#b3261e;--line:#e8d3bb;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1410;--card:#2a1d17;--text:#f6e7d7;--muted:#c3a68c;--accent:#ff8a7a;--line:#4a3528;--onacc:#1d1410;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1410;--card:#2a1d17;--text:#f6e7d7;--muted:#c3a68c;--accent:#ff8a7a;--line:#4a3528;--onacc:#1d1410;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Devanagari",system-ui,sans-serif;line-height:1.5}
main{max-width:600px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.35rem;margin:0 0 4px;color:var(--accent)}
p.sub{margin:0 0 18px;color:var(--muted);font-size:.92rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:1rem;margin:0 0 8px}
label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:transparent;color:var(--text);font-family:inherit}
.row{display:flex;gap:8px}.row .cc{width:76px;flex:none}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--text);font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit}
.theme[aria-pressed="true"]{border-color:var(--accent)}
.sw{display:inline-flex}.sw i{width:16px;height:16px;border-radius:50%;margin-right:-5px;border:1px solid rgba(0,0,0,.25)}
.btns{display:grid;gap:10px;margin-top:16px}
button.act,a.act{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:10px;border:1px solid var(--accent);font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;background:transparent;color:var(--accent)}
.primary{background:var(--accent)!important;color:var(--onacc)!important}
.wa{background:#25a244!important;border-color:#25a244!important;color:#fff!important}
[aria-disabled="true"]{opacity:.45}
button:disabled{opacity:.5}
[hidden]{display:none!important}
#hn{margin-top:10px;font-size:1.35rem;font-weight:700;color:var(--accent);min-height:1.6em;word-break:break-word}
.gate{max-width:420px;margin:12vh auto;padding:0 16px}
#gmsg{margin-top:12px;font-size:.9rem;color:var(--accent);min-height:1.3em}
#msg{margin-top:12px;font-size:.9rem;color:var(--muted);min-height:1.3em}
.hint{font-size:.82rem;color:var(--muted);margin-top:12px}
.url{font-size:.74rem;word-break:break-all;color:var(--muted);margin-top:8px;user-select:all}
.hist{margin-top:6px}.hist .it{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.preview canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block;margin-bottom:12px}
</style></head><body><div id="gate" class="gate"><div class="box">
<h1>शुभ विवाह</h1>
<p class="sub">Enter the password to continue</p>
<input id="pw" type="password" placeholder="Password" autocomplete="off">
<label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:8px"><input type="checkbox" id="showpw" style="width:auto"> Show password</label>
<div class="btns"><button class="act primary" id="enter">Open</button></div>
<div id="gmsg" role="alert"></div>
</div></div>
<main id="app" hidden>

function flower(x,c,r,y,T){
  c.save();c.translate(x,y);
  for(var k=0;k<8;k++){c.save();c.rotate(k*Math.PI/4);c.beginPath();c.ellipse(r*.62,0,r*.5,r*.3,0,0,Math.PI*2);c.fillStyle=k%2?T.f1:T.f2;c.fill();c.restore()}
  c.beginPath();c.arc(0,0,r*.33,0,Math.PI*2);c.fillStyle=T.f3;c.fill();
  c.restore();
}
function leaf(c,x,y,a,T){c.save();c.translate(x,y);c.rotate(a);c.beginPath();c.ellipse(0,0,11,5,0,0,Math.PI*2);c.fillStyle=T.leaf;c.fill();c.restore()}
function garland(c,W,H,T){
  var step=36,i,t;
  for(i=24;i<W-10;i+=step){
    [30,H-30].forEach(function(y){leaf(c,i+step/2,y,0,T);flower(i,c,15,y,T)});
  }
  for(i=24;i<H-10;i+=step){
    [30,W-30].forEach(function(x){leaf(c,x,i+step/2,Math.PI/2,T);flower(x,c,15,i,T)});
  }
}
function corner(c,cx,cy,sx,sy,T){
  c.save();c.translate(cx,cy);c.scale(sx,sy);
  for(var k=0;k<6;k++){
    c.save();c.rotate((8+k*14)*Math.PI/180);
    c.beginPath();c.ellipse(34,0,22,9,0,0,Math.PI*2);c.fillStyle=k%2?T.f1:T.f2;c.fill();c.lineWidth=2;c.strokeStyle=T.gold;c.stroke();
    c.restore();
  }
  c.beginPath();c.arc(0,0,15,0,Math.PI*2);c.fillStyle=T.gold;c.fill();
  c.beginPath();c.arc(0,0,8,0,Math.PI*2);c.fillStyle=T.maroon;c.fill();
  c.restore();
}
function decorate(c,W,H,T){
  var g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,T.bg1);g.addColorStop(1,T.bg2);c.fillStyle=g;c.fillRect(0,0,W,H);
  var rg=c.createRadialGradient(W/2,H/2,40,W/2,H/2,Math.max(W,H)*.65);rg.addColorStop(0,"rgba(255,255,255,.85)");rg.addColorStop(1,"rgba(255,255,255,0)");c.fillStyle=rg;c.fillRect(0,0,W,H);
  garland(c,W,H,T);
  c.lineWidth=7;c.strokeStyle=T.gold;c.strokeRect(56,56,W-112,H-112);
  c.lineWidth=3;c.strokeStyle=T.maroon;c.strokeRect(72,72,W-144,H-144);
  c.save();c.setLineDash([2,9]);c.lineWidth=3;c.strokeStyle=T.gold;c.strokeRect(86,86,W-172,H-172);c.restore();
  corner(c,56,56,1,1,T);corner(c,W-56,56,-1,1,T);corner(c,56,H-56,1,-1,T);corner(c,W-56,H-56,-1,-1,T);
}

function ensureBase(){return basePromise||(basePromise=ensureBase0().catch(function(e){basePromise=null;throw e}))}
async function ensureBase0(){
  if(base.length)return;
  if(!imgs.length)imgs=await loadImgs();
  var T=THEMES[themeKey];
  for(var i=0;i<imgs.length;i++){
    var im=imgs[i],W=im.width+PAD*2,H=im.height+PAD*2;

function page1(name){

var VOW=[["aa","आ","ा"],["ai","ऐ","ै"],["au","औ","ौ"],["ee","ई","ी"],["ii","ई","ी"],["oo","ऊ","ू"],["uu","ऊ","ू"],["a","अ",""],["i","इ","ि"],["u","उ","ु"],["e","ए","े"],["o","ओ","ो"]];
var CON=[["chh","छ"],["ksh","क्ष"],["kh","ख"],["gh","घ"],["ch","च"],["jh","झ"],["th","थ"],["dh","ध"],["ph","फ"],["bh","भ"],["sh","श"],["k","क"],["g","ग"],["c","क"],["j","ज"],["t","त"],["d","द"],["n","न"],["p","प"],["b","ब"],["m","म"],["y","य"],["r","र"],["l","ल"],["v","व"],["w","व"],["s","स"],["h","ह"],["f","फ"],["z","ज"],["q","क"],["x","क्स"]];
function wordToHindi(w){
  var lw=w.toLowerCase();
  if(DICT[lw])return DICT[lw];
  var toks=[],i=0,k,m;
  while(i<lw.length){
    m=null;
    for(k=0;k<VOW.length;k++){if(lw.indexOf(VOW[k][0],i)===i){m={t:"V",ind:VOW[k][1],mat:VOW[k][2],len:VOW[k][0].length};break}}
    if(!m)for(k=0;k<CON.length;k++){if(lw.indexOf(CON[k][0],i)===i){m={t:"C",ch:CON[k][1],raw:CON[k][0],len:CON[k][0].length};break}}
    if(!m){i++;continue}
    toks.push(m);i+=m.len;
  }
  var out="";
  for(i=0;i<toks.length;i++){
    var t=toks[i],nx=toks[i+1],pv=toks[i-1];
    if(t.t==="V"){
      if(pv&&pv.t==="C"){
        if(t.mat===""&&i===toks.length-1&&toks.length>2)out+="ा";else out+=t.mat;
      }else out+=t.ind;
      continue;
    }
    if(t.raw==="n"&&pv&&pv.t==="V"&&nx&&nx.t==="C"&&nx.raw!=="n"&&nx.raw!=="m"){out+="ं";continue}
    out+=t.ch;
    if(nx&&nx.t==="C")out+="्";
  }
  return out;
}

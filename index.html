<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शुभ विवाह · Wedding Card Sender</title>
<meta name="description" content="Personalised wedding invitation PDF for each guest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap">
<style>
:root{--bg:#fff8ee;--card:#ffffff;--text:#3b1d0e;--muted:#7a5a46;--accent:#b3261e;--line:#e8d3bb;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1410;--card:#2a1d17;--text:#f6e7d7;--muted:#c3a68c;--accent:#ff8a7a;--line:#4a3528;--onacc:#1d1410;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1410;--card:#2a1d17;--text:#f6e7d7;--muted:#c3a68c;--accent:#ff8a7a;--line:#4a3528;--onacc:#1d1410;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Devanagari",system-ui,sans-serif;line-height:1.5}
main{max-width:600px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.35rem;margin:0 0 4px;color:var(--accent)}
p.sub{margin:0 0 18px;color:var(--muted);font-size:.92rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:1rem;margin:0 0 8px}
label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:transparent;color:var(--text);font-family:inherit}
.row{display:flex;gap:8px}.row .cc{width:76px;flex:none}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--text);font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit}
.theme[aria-pressed="true"]{border-color:var(--accent)}
.sw{display:inline-flex}.sw i{width:16px;height:16px;border-radius:50%;margin-right:-5px;border:1px solid rgba(0,0,0,.25)}
.btns{display:grid;gap:10px;margin-top:16px}
button.act,a.act{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:10px;border:1px solid var(--accent);font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;background:transparent;color:var(--accent)}
.primary{background:var(--accent)!important;color:var(--onacc)!important}
.wa{background:#25a244!important;border-color:#25a244!important;color:#fff!important}
[aria-disabled="true"]{opacity:.45}
button:disabled{opacity:.5}
[hidden]{display:none!important}
#hn{margin-top:10px;font-size:1.35rem;font-weight:700;color:var(--accent);min-height:1.6em;word-break:break-word}
#msg{margin-top:12px;font-size:.9rem;color:var(--muted);min-height:1.3em}
.hint{font-size:.82rem;color:var(--muted);margin-top:12px}
.url{font-size:.74rem;word-break:break-all;color:var(--muted);margin-top:8px;user-select:all}
.hist{margin-top:6px}.hist .it{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.preview canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block;margin-bottom:12px}
</style></head><body><main>
<h1>शुभ विवाह · Card Sender</h1>
<p class="sub">आकांक्षा ❤ प्रियांशु · 09 दिसम्बर 2026</p>
<div class="box">
<label for="name">Guest name</label>
<input id="name" placeholder="Type the name, e.g. Ramesh Singh" autocomplete="off">
<div id="hn" lang="hi" aria-live="polite"></div>
<div class="btns">
<button class="act primary" id="dl">⬇ Download PDF</button>
<button class="act" id="share">📤 Share PDF with message</button>
<a class="act wa" id="wa" href="https://wa.me/" target="_blank" rel="noopener noreferrer">💬 WhatsApp text only</a>
</div>
<div id="msg"></div>
</div>
<div class="preview" id="prev"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var PAGES=["assets/p1.jpg","assets/p2.jpg","assets/p3.jpg"];
var PAD=110;
var NAME_POS={x:690+PAD,y:946+PAD,maxW:560,size:54};
var THEMES={
 royal:{label:"Royal Maroon & Gold",bg1:"#fff6e0",bg2:"#ffe0ad",ink:"#6b0f1a",gold:"#c9962b",maroon:"#8b1a2b",f1:"#ff9d00",f2:"#e8590c",f3:"#ffd23f",leaf:"#2f7d32"},
 saffron:{label:"Saffron & Green",bg1:"#fff4dc",bg2:"#ffd59a",ink:"#7a2e00",gold:"#e67e22",maroon:"#1b7f3b",f1:"#ff7a00",f2:"#ffb300",f3:"#fff176",leaf:"#1b7f3b"},
 rose:{label:"Rose & Teal",bg1:"#fff2f5",bg2:"#ffd0dc",ink:"#7a1038",gold:"#d4a017",maroon:"#c2185b",f1:"#ff5c8a",f2:"#ff9fbd",f3:"#ffe082",leaf:"#00897b"}
};
var themeKey="royal";
try{var s=localStorage.getItem("wc-theme");if(s&&THEMES[s])themeKey=s}catch(e){}
var imgs=[],lastBuilt=null,seq=0,timer=null;
function $(i){return document.getElementById(i)}
function say(t){$("msg").textContent=t}

function flower(x,c,r,y,T){
  c.save();c.translate(x,y);
  for(var k=0;k<8;k++){c.save();c.rotate(k*Math.PI/4);c.beginPath();c.ellipse(r*.62,0,r*.5,r*.3,0,0,Math.PI*2);c.fillStyle=k%2?T.f1:T.f2;c.fill();c.restore()}
  c.beginPath();c.arc(0,0,r*.33,0,Math.PI*2);c.fillStyle=T.f3;c.fill();
  c.restore();
}
function leaf(c,x,y,a,T){c.save();c.translate(x,y);c.rotate(a);c.beginPath();c.ellipse(0,0,11,5,0,0,Math.PI*2);c.fillStyle=T.leaf;c.fill();c.restore()}
function garland(c,W,H,T){
  var step=36,i,t;
  for(i=24;i<W-10;i+=step){
    [30,H-30].forEach(function(y){leaf(c,i+step/2,y,0,T);flower(i,c,15,y,T)});
  }
  for(i=24;i<H-10;i+=step){
    [30,W-30].forEach(function(x){leaf(c,x,i+step/2,Math.PI/2,T);flower(x,c,15,i,T)});
  }
}
function corner(c,cx,cy,sx,sy,T){
  c.save();c.translate(cx,cy);c.scale(sx,sy);
  for(var k=0;k<6;k++){
    c.save();c.rotate((8+k*14)*Math.PI/180);
    c.beginPath();c.ellipse(34,0,22,9,0,0,Math.PI*2);c.fillStyle=k%2?T.f1:T.f2;c.fill();c.lineWidth=2;c.strokeStyle=T.gold;c.stroke();
    c.restore();
  }
  c.beginPath();c.arc(0,0,15,0,Math.PI*2);c.fillStyle=T.gold;c.fill();
  c.beginPath();c.arc(0,0,8,0,Math.PI*2);c.fillStyle=T.maroon;c.fill();
  c.restore();
}
function decorate(c,W,H,T){
  var g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,T.bg1);g.addColorStop(1,T.bg2);c.fillStyle=g;c.fillRect(0,0,W,H);
  var rg=c.createRadialGradient(W/2,H/2,40,W/2,H/2,Math.max(W,H)*.65);rg.addColorStop(0,"rgba(255,255,255,.85)");rg.addColorStop(1,"rgba(255,255,255,0)");c.fillStyle=rg;c.fillRect(0,0,W,H);
  garland(c,W,H,T);
  c.lineWidth=7;c.strokeStyle=T.gold;c.strokeRect(56,56,W-112,H-112);
  c.lineWidth=3;c.strokeStyle=T.maroon;c.strokeRect(72,72,W-144,H-144);
  c.save();c.setLineDash([2,9]);c.lineWidth=3;c.strokeStyle=T.gold;c.strokeRect(86,86,W-172,H-172);c.restore();
  corner(c,56,56,1,1,T);corner(c,W-56,56,-1,1,T);corner(c,56,H-56,1,-1,T);corner(c,W-56,H-56,-1,-1,T);
}
function loadImgs(){return Promise.all(PAGES.map(function(s){return new Promise(function(r){var i=new Image();i.onload=function(){r(i)};i.src=s;})}))}

async function build(name){
  if(!imgs.length)imgs=await loadImgs();
  var T=THEMES[themeKey];
  try{await document.fonts.load("700 64px Kalam","अआ");await document.fonts.load("700 64px 'Noto Sans Devanagari'","अआ")}catch(e){}
  var pdf=null,canvases=[];
  for(var i=0;i<imgs.length;i++){
    var im=imgs[i],W=im.width+PAD*2,H=im.height+PAD*2;
    var c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
    decorate(x,W,H,T);
    var t=document.createElement("canvas");t.width=im.width;t.height=im.height;var tx=t.getContext("2d");
    tx.drawImage(im,0,0);tx.globalCompositeOperation="lighten";tx.fillStyle=T.ink;tx.fillRect(0,0,t.width,t.height);
    x.globalCompositeOperation="multiply";x.drawImage(t,PAD,PAD);x.globalCompositeOperation="source-over";
    if(i===0&&name){
      var s=NAME_POS.size;x.fillStyle=T.ink;x.textBaseline="alphabetic";
      do{x.font="700 "+s+"px Kalam,'Noto Sans Devanagari',sans-serif";s-=2}while(x.measureText(name).width>NAME_POS.maxW&&s>20);
      x.fillText(name,NAME_POS.x,NAME_POS.y);
    }
    canvases.push(c);
    var o=W>H?"l":"p";
    if(!pdf)pdf=new window.jspdf.jsPDF({orientation:o,unit:"px",format:[W,H],compress:true});
    else pdf.addPage([W,H],o);
    pdf.addImage(c.toDataURL("image/jpeg",0.9),"JPEG",0,0,W,H);
  }
  return {pdf:pdf,canvases:canvases};
}
themeKey="royal";
var DICT={singh:"सिंह",kumar:"कुमार",kumari:"कुमारी",sharma:"शर्मा",verma:"वर्मा",yadav:"यादव",pandey:"पांडेय",pande:"पांडे",mishra:"मिश्रा",gupta:"गुप्ता",tiwari:"तिवारी",tripathi:"त्रिपाठी",dubey:"दुबे",shukla:"शुक्ला",srivastava:"श्रीवास्तव",maurya:"मौर्य",patel:"पटेल",jaiswal:"जायसवाल",chaudhary:"चौधरी",chaudhari:"चौधरी",rai:"राय",thakur:"ठाकुर",devi:"देवी",ram:"राम",shyam:"श्याम",mohan:"मोहन",rajesh:"राजेश",ramesh:"रमेश",suresh:"सुरेश",mahesh:"महेश",dinesh:"दिनेश",rakesh:"राकेश",sanjay:"संजय",ajay:"अजय",vijay:"विजय",amit:"अमित",rahul:"राहुल",rohit:"रोहित",anil:"अनिल",sunil:"सुनील",manoj:"मनोज",pradeep:"प्रदीप",deepak:"दीपक",ashok:"अशोक",vinod:"विनोद",rajiv:"राजीव",rajeev:"राजीव",rajendra:"राजेंद्र",mahendra:"महेंद्र",narendra:"नरेंद्र",surendra:"सुरेंद्र",virendra:"वीरेंद्र",dharmendra:"धर्मेंद्र",abhay:"अभय",vikas:"विकास",vivek:"विवेक",ankit:"अंकित",ankita:"अंकिता",anjali:"अंजलि",priya:"प्रिया",pooja:"पूजा",neha:"नेहा",sunita:"सुनीता",anita:"अनीता",sita:"सीता",geeta:"गीता",gita:"गीता",radha:"राधा",krishna:"कृष्ण",shiv:"शिव",shankar:"शंकर",ganesh:"गणेश",shri:"श्री",shrimati:"श्रीमती",aman:"अमन",akanksha:"आकांक्षा",priyanshu:"प्रियांशु",tirtharaj:"तीर्थराज",ashish:"आशीष",ashutosh:"आशुतोष",shailendra:"शैलेंद्र",awadhesh:"अवधेश",sanjeev:"संजीव",mritunjay:"मृत्युंजय",pratap:"प्रताप",santosh:"संतोष",kuldeep:"कुलदीप",harish:"हरीश",mukesh:"मुकेश",umesh:"उमेश",ganga:"गंगा",lakshmi:"लक्ष्मी",saraswati:"सरस्वती",parivar:"परिवार",family:"परिवार",ji:"जी",and:"एवं",mr:"श्री",mrs:"श्रीमती",dr:"डॉ.",prof:"प्रो.",bhai:"भाई",didi:"दीदी",bhabhi:"भाभी",mama:"मामा",chacha:"चाचा",chachi:"चाची",mausi:"मौसी",bua:"बुआ",fufa:"फूफा",nana:"नाना",nani:"नानी",dada:"दादा",dadi:"दादी"};
var VOW=[["aa","आ","ा"],["ai","ऐ","ै"],["au","औ","ौ"],["ee","ई","ी"],["ii","ई","ी"],["oo","ऊ","ू"],["uu","ऊ","ू"],["a","अ",""],["i","इ","ि"],["u","उ","ु"],["e","ए","े"],["o","ओ","ो"]];
var CON=[["chh","छ"],["ksh","क्ष"],["kh","ख"],["gh","घ"],["ch","च"],["jh","झ"],["th","थ"],["dh","ध"],["ph","फ"],["bh","भ"],["sh","श"],["k","क"],["g","ग"],["c","क"],["j","ज"],["t","त"],["d","द"],["n","न"],["p","प"],["b","ब"],["m","म"],["y","य"],["r","र"],["l","ल"],["v","व"],["w","व"],["s","स"],["h","ह"],["f","फ"],["z","ज"],["q","क"],["x","क्स"]];
function wordToHindi(w){
  var lw=w.toLowerCase();
  if(DICT[lw])return DICT[lw];
  var toks=[],i=0,k,m;
  while(i<lw.length){
    m=null;
    for(k=0;k<VOW.length;k++){if(lw.indexOf(VOW[k][0],i)===i){m={t:"V",ind:VOW[k][1],mat:VOW[k][2],len:VOW[k][0].length};break}}
    if(!m)for(k=0;k<CON.length;k++){if(lw.indexOf(CON[k][0],i)===i){m={t:"C",ch:CON[k][1],raw:CON[k][0],len:CON[k][0].length};break}}
    if(!m){i++;continue}
    toks.push(m);i+=m.len;
  }
  var out="";
  for(i=0;i<toks.length;i++){
    var t=toks[i],nx=toks[i+1],pv=toks[i-1];
    if(t.t==="V"){
      if(pv&&pv.t==="C"){
        if(t.mat===""&&i===toks.length-1&&toks.length>2)out+="ा";else out+=t.mat;
      }else out+=t.ind;
      continue;
    }
    if(t.raw==="n"&&pv&&pv.t==="V"&&nx&&nx.t==="C"&&nx.raw!=="n"&&nx.raw!=="m"){out+="ं";continue}
    out+=t.ch;
    if(nx&&nx.t==="C")out+="्";
  }
  return out;
}
function toHindi(s){return s.replace(/[A-Za-z]+/g,wordToHindi)}

function $v(){return $("name").value.trim()}
function getName(){return toHindi($v())}
function greeting(name,att){
  return "🙏 नमस्ते "+(name?name+" जी":"")+",\n\nआपको आकांक्षा सिंह एवं प्रियांशु सिंह के शुभ विवाह (09 दिसम्बर 2026, बुधवार) में सादर आमंत्रित किया जाता है।\nविवाह स्थल: ओमकार उपवन, बी.एल.डब्लू रोड, हहिरपुर, रोहनिया, वाराणसी।\n\n"+(att?"निमंत्रण पत्र संलग्न है। ":"")+"आपकी उपस्थिति हमारे लिए सौभाग्य की बात होगी। 🙏\n— तीर्थराज सिंह एवं समस्त परिवार";
}
function fname(name){
  var base=(name||"Guest").replace(/[^\w\u0900-\u097F]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"Guest";
  return "Wedding-Card-"+base+".pdf";
}
function updateWa(){$("hn").textContent=getName();$("wa").href="https://wa.me/?text="+encodeURIComponent(greeting(getName(),false))}
async function refresh(){
  var my=++seq;
  var r=await build(getName());
  if(my!==seq)return;
  lastBuilt=r;
  var pv=$("prev");pv.innerHTML="";
  r.canvases.forEach(function(c){var d=document.createElement("canvas");d.width=c.width;d.height=c.height;d.getContext("2d").drawImage(c,0,0);pv.appendChild(d)});
}
function schedule(){clearTimeout(timer);timer=setTimeout(refresh,350)}

async function saveFile(pdf,fn){
  try{pdf.save(fn);return "ok"}catch(e){return "error:"+e.message}
}

function need(){var n=getName();if(!n){say("Please enter the guest’s name first.");return null}return n}
$("dl").onclick=async function(){
  var name=need();if(!name)return;
  this.disabled=true;say("Making the PDF…");
  try{
    await refresh();
    var res=await saveFile(lastBuilt.pdf,fname(name));
    say(res==="ok"?"PDF saved.":res==="declined"?"Download cancelled.":"Could not download: "+res);
  }catch(e){say("Something went wrong: "+e.message)}
  this.disabled=false;
};
$("share").onclick=async function(){
  var name=need();if(!name)return;
  this.disabled=true;say("Making the PDF…");
  try{
    await refresh();
    var fn=fname(name),file=new File([lastBuilt.pdf.output("blob")],fn,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],text:greeting(name,true)});say("Shared.");this.disabled=false;return}
      catch(e){if(e&&e.name==="AbortError"){say("Share cancelled.");this.disabled=false;return}}
    }
    var res=await saveFile(lastBuilt.pdf,fn);
    say(res==="ok"?"Sharing isn’t available here, so the PDF was saved instead. Attach it in WhatsApp with 📎 → Document.":"Could not share or save: "+res);
  }catch(e){say("Something went wrong: "+e.message)}
  this.disabled=false;
};
$("wa").addEventListener("click",function(){say("WhatsApp opened with the message only. Choose a contact.")});
$("name").addEventListener("input",function(){updateWa();schedule()});
updateWa();refresh();
</script></body></html>
